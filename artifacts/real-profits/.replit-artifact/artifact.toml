kind = "web"
previewPath = "/"
title = "RealProfits.com"
version = "1.0.0"
id = "artifacts/real-profits"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21644

[services.development]
run = "pnpm --filter @workspace/real-profits run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/real-profits", "run", "build" ]
publicDir = "artifacts/real-profits/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21644"
BASE_PATH = "/"
